<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact us — Acme Support</title>
  </head>
  <body>
    <header>
      <p>Acme Support</p>
      <nav aria-label="Primary">
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#help">Help</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Contact us</h1>
      <p>Send us a message and we will get back to you.</p>

      <form action="https://example.com/contact" method="post">
        <p>
          <label for="full-name">Full name</label>
          <input
            id="full-name"
            name="full-name"
            type="text"
            required
            autocomplete="name"
          />
        </p>

        <p>
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
          />
        </p>

        <p>
          <label for="subject">Subject</label>
          <select id="subject" name="subject">
            <option value="">Choose a topic</option>
            <option value="billing">Billing</option>
            <option value="technical-support">Technical support</option>
            <option value="general">General question</option>
          </select>
        </p>

        <p>
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            required
            minlength="20"
          ></textarea>
        </p>

        <fieldset>
          <legend>How did you hear about us?</legend>
          <p>
            <input
              id="hear-search"
              name="hear-about-us"
              type="radio"
              value="search"
            />
            <label for="hear-search">Search</label>
          </p>
          <p>
            <input
              id="hear-friend"
              name="hear-about-us"
              type="radio"
              value="friend"
            />
            <label for="hear-friend">Friend</label>
          </p>
          <p>
            <input
              id="hear-social"
              name="hear-about-us"
              type="radio"
              value="social-media"
            />
            <label for="hear-social">Social media</label>
          </p>
        </fieldset>

        <p>
          <input
            id="newsletter"
            name="newsletter"
            type="checkbox"
            value="product-updates"
          />
          <label for="newsletter">Send me product updates</label>
        </p>

        <p>
          <button type="submit">Send message</button>
        </p>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Acme Support</p>
    </footer>
  </body>
</html>
